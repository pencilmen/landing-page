<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typographic Header</title>
    <link rel="stylesheet" href="./styles.css">
    <script type="importmap">
    {
        "imports": {
            "gsap": "https://cdn.jsdelivr.net/npm/gsap@3/index.js",
            "gsap/SplitText": "https://cdn.jsdelivr.net/npm/gsap@3/SplitText.js"
        }
    }
    </script>
</head>
<body>
    <section class="spotlight">
        <h1 class="spotlight-title">
            Make Your Mark
            <span data-weight="medium">Don't</span>
            <span data-weight="thin"> Bother </span>
        </h1>
    </section>
    <script type="module" src="./script.js"></script>
</body>
</html>
